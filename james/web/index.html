<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>James · Local Workbench</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><b class="mark">J</b> James <span>Workbench</span></div><div class="model" id="model"></div><button id="sketch">Prototype from Sketch</button></header>
<main><aside class="left"><small>WORKSPACE</small><h2 id="project">Project</h2><div class="bar"><h3>Milestones</h3><button id="folder" title="Create milestone">+ Folder</button></div><nav id="tree"></nav><div class="tools"><button id="subfile">+ Follow-up</button><button id="manage">Rename / move</button></div><div class="bar"><h3>Project files</h3><button id="up">Up</button></div><small id="directory"></small><nav id="files"></nav></aside>
<section class="center"><div class="sectionHead"><div><small>CODE VIEWER</small><h2 id="filename">Choose a project file</h2></div><span class="tag">Read only</span></div><div class="editor"><textarea id="code" spellcheck="false" readonly aria-label="Read-only source" placeholder="Open a file from the sidebar. Select lines to ask James about them."></textarea><button id="selection" hidden>Ask James ↗</button></div>
<section class="conversation"><div class="sectionHead"><div><small>CONVERSATION</small><h2 id="threadName">Project</h2></div><button id="plan">New build plan</button></div><div id="feed" role="log" aria-label="Live tool activity" hidden></div><div id="history" aria-live="polite"></div><form id="composer"><span id="reference" hidden></span><textarea id="question" required rows="2" placeholder="Ask James a follow-up…" aria-label="Question"></textarea><button class="primary">Ask James ↗</button></form></section></section>
<aside class="right"><small>ENGINE DASHBOARD</small><section id="guide"><p id="nextAction" role="status">Loading plan…</p><button id="stop" hidden>Stop step</button></section><div class="bar"><h2>Build plan</h2><span class="tag" id="phase">Idle</span></div><ol id="todo"></ol><div class="tools"><button id="approve">Approve</button><button class="primary" id="step">Run step →</button></div><button id="packet" hidden>Copy Cloud Consultation Packet</button><button id="hint" hidden>Supply repair hint</button><button id="confirm" hidden>Confirm behavioral fix</button><hr><h3>Context window</h3><div class="metric"><strong id="used">0</strong> / 16,384</div><progress id="meter" max="16384" value="0"></progress><p id="budget"></p><div id="loaded"></div></aside></main>
<footer><span id="status" role="status">Connecting…</span><span>James v2.1</span></footer>
<dialog id="modal"><form id="dialogForm"><div class="bar"><h2 id="title"></h2><button type="button" id="close" aria-label="Close">×</button></div><label id="label" for="input"></label><textarea id="input" rows="4"></textarea><label id="parentLabel" hidden>Parent folder<select id="parent"></select></label><label id="imageLabel" hidden>Paste or upload a wireframe<input id="image" type="file" accept="image/*"><img id="preview" hidden alt="Sketch preview"></label><button class="primary" id="submit">Save</button></form></dialog><script src="/app.js"></script></body></html>
