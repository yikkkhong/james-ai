[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "james-local-agent"
version = "2.1.0"
description = "A task-scoped local coding orchestrator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cli = ["rich>=13"]
ui = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
james = "james.cli:main"

[tool.setuptools]
packages = ["james"]

[tool.setuptools.package-data]
james = ["prompts/*.txt", "web/*"]
